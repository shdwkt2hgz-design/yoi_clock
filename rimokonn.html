<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yoi HUD Remote - Final</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
body {
            background: #020617; color: #38bdf8;
            font-family: 'Share Tech Mono', monospace;
            display: flex; flex-direction: column; align-items: center; 
            padding: 10px; /* 余白を少し詰める */
        }

        /* パネル内のボタンの並びを最適化 */
        .panel {
            width: 90%; /* 幅を微調整 */
            max-width: 350px; border: 1px solid #38bdf8;
            padding: 15px; margin-bottom: 15px; border-radius: 10px;
            background: rgba(56, 189, 248, 0.05);
            box-sizing: border-box;
        }

        /* ボタンのパディングを少し調整してコンパクトに */
        button {
            width: 100%; padding: 12px; margin: 4px 0;
            background: transparent; border: 1px solid #38bdf8;
            color: #38bdf8; font-family: inherit; font-size: 13px;
            cursor: pointer; transition: 0.2s;
            box-sizing: border-box;
        }
        button:active { background: rgba(56, 189, 248, 0.2); }
        button.active { background: #38bdf8; color: #020617; box-shadow: 0 0 10px #38bdf8; }
        
        input[type="range"] { width: 100%; margin: 15px 0; accent-color: #38bdf8; }
        input[type="text"] { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #38bdf8; color: #38bdf8; text-align: center; padding: 12px; margin: 10px 0; font-family: inherit; box-sizing: border-box; }
        
        .val-display { text-align: right; font-size: 18px; margin-bottom: 5px; }
        .status { font-size: 12px; margin-bottom: 20px; color: #a855f7; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="panel">
        <div class="label">TIME DILATION CONTROL</div>
        <div style="display: flex; gap: 8px;">
            <button id="timer-off" onclick="setTimerMode('OFF')">CLOCK</button>
            <button id="timer-down" onclick="setTimerMode('COUNTDOWN')">DOWN</button>
            <button id="timer-up" onclick="setTimerMode('COUNTUP')">UP</button>
        </div>
        
        <input type="text" id="timer-display" value="00:00">
        <button onclick="updateTimerDisplay()" style="border-style: double; border-width: 3px; font-size: 12px; padding: 10px;">SET VALUE</button>

        <!-- ここに移動：横並びで枠内に収める -->
        <div style="display: flex; gap: 8px; margin-top: 10px;">
            <button id="timer-start" onclick="toggleTimer()" style="flex: 2; background: rgba(56, 189, 248, 0.1);">START / PAUSE</button>
            <button onclick="resetTimer()" style="flex: 1; opacity: 0.6; font-size: 11px;">RESET</button>
        </div>
    </div>

    <div class="panel">
        <div class="label">STORY PROGRESSION (EXP)</div>
        <div class="val-display" id="prog-val">00.00%</div>
<input type="range" id="prog-slider" min="0" max="100" value="12" step="0.01" oninput="updateLocalProg(this.value)">
<button id="prog-btn" onclick="sendProgress()" style="border-style: double; border-width: 3px;">APPLY PROGRESS</button>
        <button id="prog-toggle" onclick="toggleProgressVisibility()" style="margin-top: 15px; font-size: 12px; opacity: 0.7;">SHOW/HIDE MODULE</button>
    </div>

    <div class="panel">
        <div class="label">SYSTEM INTEGRITY</div>
        <button id="glitch-btn" onclick="toggleGlitch()" style="color: #f87171; border-color: #f87171;">TRIGGER SYNC ERROR</button>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAzoy19DasTizIajmp7mvocNT3OL0fL_a0",
  authDomain: "yoi-clock.firebaseapp.com",
  databaseURL: "https://yoi-clock-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "yoi-clock",
  storageBucket: "yoi-clock.firebasestorage.app",
  messagingSenderId: "69121635311",
  appId: "1:69121635311:web:dc62590a64902fc6dc7c1a",
  measurementId: "G-LN98DS3HTS"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const settingsRef = ref(db, 'hud_settings');

    let currentSettings = {};
    let localProgVal = 12;

onValue(settingsRef, (snap) => {
        currentSettings = snap.val() || {};
        
        // document.getElementById('conn-status').innerText = "SYSTEM ONLINE"; // 消したので不要なら削除
        
        if (currentSettings.timer_display) {
            document.getElementById('timer-display').value = currentSettings.timer_display;
        }

        // --- ここから追加：進捗率の同期 ---
        if (currentSettings.progress_val !== undefined) {
            const pVal = parseFloat(currentSettings.progress_val).toFixed(2);
            localProgVal = pVal; // 内部変数も更新
            document.getElementById('prog-val').innerText = pVal + "%"; // 文字列を更新
            document.getElementById('prog-slider').value = pVal; // スライダーのツマミを移動
        }
        // --- ここまで ---
        
        // UI状態（ボタンの光り方など）の更新
        document.getElementById('glitch-btn').className = currentSettings.glitch ? "active" : "";
        document.getElementById('prog-toggle').className = currentSettings.show_progress ? "active" : "";
        
        const mode = currentSettings.timer_mode || 'OFF';
        document.getElementById('timer-off').className = mode === 'OFF' ? 'active' : '';
        document.getElementById('timer-down').className = mode === 'COUNTDOWN' ? 'active' : '';
        document.getElementById('timer-up').className = mode === 'COUNTUP' ? 'active' : '';
    });

    // 1. タイマー関数
    window.setTimerMode = (mode) => {
        update(settingsRef, { timer_mode: mode });
    };
    window.updateTimerDisplay = () => {
        const val = document.getElementById('timer-display').value;
        update(settingsRef, { timer_display: val });
    };
    let timerInterval = null;

    // タイマーを動かす・止める
    window.toggleTimer = () => {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('timer-start').classList.remove('active');
        } else {
            document.getElementById('timer-start').classList.add('active');
            timerInterval = setInterval(runTimer, 1000);
        }
    };

    // 実際に時間を計算してFirebaseに送る
    function runTimer() {
        const display = document.getElementById('timer-display').value;
        const mode = currentSettings.timer_mode || 'OFF';
        
        let [min, sec] = display.split(':').map(Number);
        let totalSec = min * 60 + sec;

        if (mode === 'COUNTDOWN') {
            totalSec = Math.max(0, totalSec - 1);
        } else if (mode === 'COUNTUP') {
            totalSec++;
        }

        const newMin = Math.floor(totalSec / 60).toString().padStart(2, '0');
        const newSec = (totalSec % 60).toString().padStart(2, '0');
        const newVal = `${newMin}:${newSec}`;

        document.getElementById('timer-display').value = newVal;
        update(settingsRef, { timer_display: newVal });

        if (totalSec === 0 && mode === 'COUNTDOWN') {
            toggleTimer(); // 0になったら自動停止
        }
    }

    window.resetTimer = () => {
        if (timerInterval) toggleTimer();
        document.getElementById('timer-display').value = "03:00";
        update(settingsRef, { timer_display: "03:00" });
    };

    // 2. 進捗関数（スライダーで保持、ボタンで送信）
window.updateLocalProg = (val) => {
    localProgVal = parseFloat(val).toFixed(2); // 小数点第2位まで表示
    document.getElementById('prog-val').innerText = localProgVal + "%";
};

window.sendProgress = () => {
        // parseInt ではなく parseFloat にすることで、小数点も維持して送信
        update(settingsRef, { progress_val: parseFloat(localProgVal) });
    };
    window.toggleProgressVisibility = () => {
        update(settingsRef, { show_progress: !currentSettings.show_progress });
    };

    // 3. エラー関数
    window.toggleGlitch = () => {
        update(settingsRef, { glitch: !currentSettings.glitch });
    };
</script>
</body>
</html>
